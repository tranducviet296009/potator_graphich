name: Build PotatoGFX-KSU Module

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-module:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Android NDK r26d
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Compile Zygisk arm64-v8a.so & Package Flashable ZIP
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          sed -i 's/\r$//' build.sh customize.sh service.sh uninstall.sh
          chmod +x build.sh
          ./build.sh

      - name: Upload Flashable KernelSU Module ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PotatoGFX-KSU-v1.1.0-arm64
          path: PotatoGFX-KSU-v1.1.0-arm64.zip
          if-no-files-found: error
