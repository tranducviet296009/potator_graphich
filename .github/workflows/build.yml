name: Build PotatoGFX-KSU Module

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-module:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Android NDK r26d
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Normalize Line Endings & Strip UTF-8 BOM
        run: |
          find . -type f \( -name "*.sh" -o -name "*.prop" -o -name "*.json" -o -name "*.cpp" -o -name "*.hpp" -o -name "*.txt" \) -exec sed -i '1s/^\xEF\xBB\xBF//;s/\r$//' {} +

      - name: Compile Zygisk arm64-v8a.so & Package Flashable ZIP
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          bash ./build.sh

      - name: Upload Flashable KernelSU Module ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PotatoGFX-KSU-v1.1.0-arm64
          path: PotatoGFX-KSU-v1.1.0-arm64.zip
          if-no-files-found: error
